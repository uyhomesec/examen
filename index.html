<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Examen CCTV HomeSec</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de lectura para el alumno; el panel docente se ensancha y se organiza alrededor de la tabla de entregas. */
:root{
  --logo-filter:none; --bg:#f3f5f8; --surface:#ffffff; --ink:#0f1b2d; --muted:#566377; --line:#d6dce6;
  --brand:#14284b; --on-brand:#ffffff; --gold:#8f6407; --sel:#fff3d1;
  --ok:#17724a; --ok-bg:#e1f3e8; --bad:#b3261e; --bad-bg:#fbe9e7;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --logo-filter:brightness(0) invert(.93); --bg:#0b1322; --surface:#121d31; --ink:#e7edf6; --muted:#97a6bc; --line:#26354f;
    --brand:#e5b043; --on-brand:#0b1322; --gold:#e5b043; --sel:#2b2610;
    --ok:#5fcf97; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1714; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --logo-filter:brightness(0) invert(.93); --bg:#0b1322; --surface:#121d31; --ink:#e7edf6; --muted:#97a6bc; --line:#26354f;
  --brand:#e5b043; --on-brand:#0b1322; --gold:#e5b043; --sel:#2b2610;
  --ok:#5fcf97; --ok-bg:#12301f; --bad:#ff8a80; --bad-bg:#3a1714; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:46rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:68rem}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:.5rem 1.25rem;padding-block:.65rem}
.brand{display:flex;align-items:baseline;gap:.75rem;min-width:0}
.brand img{height:2.7rem;width:auto;display:block;filter:var(--logo-filter)}
.mark{font:700 1.4rem/1 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.mark b{color:var(--gold);font-weight:700}
.brandsub{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:.25rem;margin-left:auto}
.tab{appearance:none;background:transparent;border:1px solid transparent;color:var(--muted);font:500 .85rem var(--f-body);padding:.35rem .7rem;border-radius:4px;cursor:pointer}
.tab[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:var(--surface)}
.prog{display:flex;align-items:center;gap:.7rem;margin-left:auto;min-width:0}
.prog span{font:500 .8rem var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{width:9rem;max-width:34vw;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold)}
@media (prefers-reduced-motion: no-preference){.track i{transition:width .2s ease}}
#main{padding-block:1.75rem 4rem}
h1{font:700 clamp(2.3rem,8vw,3.4rem)/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase;margin:.35rem 0 1.4rem;text-wrap:balance}
h2{font:600 1.6rem/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 .8rem;text-wrap:balance}
.eyebrow{font:500 .75rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:0}
p{margin:0 0 1rem}
.spec{display:grid;grid-template-columns:max-content minmax(0,1fr);border-top:1px solid var(--line);margin:0 0 1.75rem}
.spec dt,.spec dd{margin:0;padding:.55rem 0;border-bottom:1px solid var(--line)}
.spec dt{font:500 .76rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-right:1.5rem;display:flex;align-items:center}
label.lbl{display:block;font-weight:600;margin-bottom:.4rem}
input[type=text],input[type=number],input[type=email],input[type=password],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:.65rem .75rem;width:100%}
textarea{font:400 .85rem/1.4 var(--f-mono);resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.btn:focus-visible,.tab:focus-visible,.lk:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{appearance:none;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font:600 .95rem var(--f-body);padding:.7rem 1.25rem;border-radius:4px;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:.4rem .8rem;font-size:.85rem}
.lk{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.msg{font-size:.9rem;color:var(--muted);margin:.5rem 0 0;min-height:1.2em}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.note{border:1px solid var(--line);background:var(--surface);padding:.75rem .9rem;border-radius:6px;font-size:.92rem;margin:0 0 1.25rem}
.note.warn{border-color:var(--gold)}
.sec{margin:2.6rem 0 1.1rem}
.sec p{margin:0}
.sec h2{margin:.2rem 0 0}
.q{margin:0 0 1.6rem;scroll-margin-top:6rem}
.qh{display:flex;gap:.7rem;align-items:baseline;margin:0 0 .6rem;font-weight:600}
.qn{font:500 .8rem var(--f-mono);color:var(--muted);min-width:2.2ch;flex:none;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:.45rem}
.opt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.75rem;align-items:start;padding:.65rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--gold);background:var(--sel)}
.opt:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.bd{font:600 .8rem var(--f-mono);width:1.6rem;height:1.6rem;display:grid;place-items:center;border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.opt.sel .bd{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.submit{margin-top:2.5rem;border-top:1px solid var(--line);padding-top:1.5rem}
.confirm{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1rem 1.1rem;margin-top:1rem}
.confirm p{margin:0 0 .8rem}
.code{margin:.5rem 0 .8rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:0 0 2.2rem}
.stat{background:var(--surface);padding:.8rem 1rem;min-width:0}
.stat .k{font:500 .72rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 2rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.blk{margin:0 0 2.4rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:40rem;font-variant-numeric:tabular-nums}
th{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:.6rem .8rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .8rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.on td{background:var(--sel)}
th.num,td.num{text-align:right}
.pill{display:inline-block;font:600 .74rem var(--f-mono);letter-spacing:.04em;padding:.15rem .5rem;border-radius:3px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:1.4rem 1rem;color:var(--muted)}
.detail{margin-top:1rem;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.dh{padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 .3rem}
.it{display:grid;grid-template-columns:2.4rem minmax(0,1fr);gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it.bad{background:var(--bad-bg)}
.it .t{font-weight:600;margin:0 0 .2rem}
.ans{font-size:.9rem;margin:.1rem 0 0}
.ans b{font:500 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:.45rem}
.hard{display:grid;gap:.85rem}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) 12rem;gap:.3rem 1.2rem;align-items:center}
.hrow .tr{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.hrow .tr i{display:block;height:100%;background:var(--bad)}
.hrow .pc{font:500 .78rem var(--f-mono);color:var(--muted);margin-top:.2rem;font-variant-numeric:tabular-nums}
@media (max-width:36rem){.hrow{grid-template-columns:minmax(0,1fr)}}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:2rem}
.tools .setrow{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.tools .setrow input{width:6rem}
footer{margin-top:3rem;font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.login{max-width:24rem}
.pill.warn{background:var(--sel);color:var(--gold)}
footer .lk{text-transform:uppercase;letter-spacing:inherit}
</style>
</head>

(function(){
'use strict';
var DATA = {"sections":[{"n":1,"t":"Componentes y tecnolog\u00eda del sistema CCTV"},{"n":2,"t":"El operador: criterio, incidentes y evidencia"},{"n":3,"t":"Marco legal uruguayo"},{"n":4,"t":"Interfaz web Hikvision: acceso, vista en vivo, reproducci\u00f3n y exportaci\u00f3n"},{"n":5,"t":"Configuraci\u00f3n, mantenimiento y diagn\u00f3stico"}],"qs":[{"n":1,"s":1,"q":"Un cliente tiene un buen tendido de cable coaxial y quiere modernizar su sistema sin rehacer toda la infraestructura. \u00bfQu\u00e9 plantea el manual?","o":["Conviene pasar siempre a IP, porque IP es mejor en todos los casos de instalaci\u00f3n.","Hay que cambiar primero todo el tendido por fibra \u00f3ptica antes de tomar cualquier decisi\u00f3n.","Puede convenir mantener o ampliar el sistema anal\u00f3gico, aprovechando el coaxial que ya existe.","Solo se puede modernizar con c\u00e1maras inal\u00e1mbricas, sin volver a tocar el cableado."]},{"n":2,"s":1,"q":"Una c\u00e1mara IP queda a 140 m del switch y se piensa conectarla con un \u00fanico tramo de cable UTP. \u00bfQu\u00e9 indica el manual sobre esa distancia?","o":["Ethernet cubre t\u00edpicamente hasta 100 m por tramo; para m\u00e1s distancia se usa fibra o infraestructura activa.","Cat5e y Cat6 llegan a esa distancia sin problema siempre que la c\u00e1mara se alimente por PoE y el cable sea de buena calidad.","Solo se resuelve pasando todo el sistema a cable coaxial, que no tiene l\u00edmites de distancia.","Alcanza con subir el bitrate de la c\u00e1mara para compensar la p\u00e9rdida de se\u00f1al del tramo largo."]},{"n":3,"s":1,"q":"Un cliente instal\u00f3 un disco de gran capacidad y asegura que guardar\u00e1 \u201cmuchos d\u00edas\u201d de video. \u00bfQu\u00e9 advierte el manual?","o":["Un disco grande garantiza m\u00e1s d\u00edas de grabaci\u00f3n, sea cual sea la configuraci\u00f3n de las c\u00e1maras.","La retenci\u00f3n depende solamente de la capacidad del disco y de la cantidad de c\u00e1maras instaladas en el sistema, por lo que no se puede mejorar.","La retenci\u00f3n queda fijada por el fabricante del disco y no se puede modificar desde el equipo.","Los d\u00edas de retenci\u00f3n dependen de c\u00e1maras, resoluci\u00f3n, FPS, bitrate y c\u00f3dec, y se deben calcular y comprobar."]},{"n":4,"s":1,"q":"Se cambia la compresi\u00f3n de H.264 a H.265 en un sistema que ya funciona. \u00bfQu\u00e9 se puede afirmar seg\u00fan el manual?","o":["Reduce siempre el consumo a la mitad, sin importar la escena que se est\u00e9 grabando en cada una de las c\u00e1maras del sistema.","Suele reducir el consumo de almacenamiento, aunque el resultado real depende de la escena y del fabricante.","No cambia el almacenamiento, solo mejora la visi\u00f3n nocturna de las c\u00e1maras que usan infrarrojo.","Aumenta el consumo de disco, por lo que obliga a reducir los d\u00edas de retenci\u00f3n configurados."]},{"n":5,"s":1,"q":"Frente a una c\u00e1mara anal\u00f3gica, \u00bfqu\u00e9 describe mejor a una c\u00e1mara en un sistema IP?","o":["Es un sensor simple que entrega la se\u00f1al y deja todo el procesamiento en el grabador.","Es un dispositivo digital con CPU, firmware y direcci\u00f3n IP propios, conectado a la red.","Es un equipo aislado de la red, por lo que no presenta riesgos de ciberseguridad propios.","Es un dispositivo que depende del cable coaxial y de una alimentaci\u00f3n siempre separada."]},{"n":6,"s":1,"q":"\u00bfCu\u00e1l es el orden de la cadena funcional de un sistema CCTV que presenta el manual?","o":["Escena, c\u00e1mara, grabador/VMS, medio de transmisi\u00f3n, monitor/operador, almacenamiento, exportaci\u00f3n o respuesta.","C\u00e1mara, escena, medio de transmisi\u00f3n, almacenamiento, grabador/VMS, monitor/operador, exportaci\u00f3n o respuesta.","Escena, medio de transmisi\u00f3n, c\u00e1mara, almacenamiento, grabador/VMS, exportaci\u00f3n o respuesta, monitor/operador.","Escena, c\u00e1mara, medio de transmisi\u00f3n, grabador/VMS, almacenamiento, monitor/operador, exportaci\u00f3n o respuesta."]},{"n":7,"s":1,"q":"\u00bfQu\u00e9 es un VMS y en qu\u00e9 se diferencia de un DVR o un NVR?","o":["Es un software de gesti\u00f3n que puede administrar varios grabadores, c\u00e1maras, usuarios, alarmas y anal\u00edtica.","Es un grabador con disco propio que reemplaza al DVR cuando se instalan c\u00e1maras de alta resoluci\u00f3n.","Es el protocolo que usan las c\u00e1maras IP para transportar el video por el cable de red.","Es una c\u00e1mara con anal\u00edtica integrada que graba en su propia tarjeta de memoria interna."]},{"n":8,"s":1,"q":"Un puesto de control muestra decenas de c\u00e1maras al mismo tiempo en un solo monitor. \u00bfQu\u00e9 advierte el manual?","o":["Cuantas m\u00e1s c\u00e1maras se vean a la vez, menos eventos se pierden, por lo que conviene mostrar todas.","La saturaci\u00f3n afecta solo al grabador y no modifica en nada el trabajo de quien opera el puesto de control, que ve todo igual.","Demasiadas c\u00e1maras simult\u00e1neas reducen la capacidad de detectar eventos; el puesto debe mostrar lo relevante.","Lo recomendable es que el operador mire una \u00fanica c\u00e1mara hasta que ocurra alg\u00fan evento."]},{"n":9,"s":1,"q":"Se instala una c\u00e1mara anal\u00f3gica sobre coaxial. \u00bfC\u00f3mo suele resolverse su alimentaci\u00f3n, seg\u00fan el manual?","o":["La alimentaci\u00f3n viaja siempre por PoE a trav\u00e9s del mismo coaxial que lleva el video.","La c\u00e1mara toma la energ\u00eda del DVR a trav\u00e9s de la propia se\u00f1al de video, sin otro cable.","El video y la alimentaci\u00f3n suelen ir por tendidos separados o por un cable siam\u00e9s.","Se alimenta \u00fanicamente con una UPS conectada directamente a cada una de las c\u00e1maras."]},{"n":10,"s":1,"q":"\u00bfEn cu\u00e1l de estas escenas resulta m\u00e1s \u00fatil una c\u00e1mara con WDR?","o":["Un acceso con fuerte contraluz, con zonas muy claras junto a zonas muy oscuras.","Un dep\u00f3sito sin ventanas, con iluminaci\u00f3n pareja durante todo el d\u00eda.","Una calle sin alumbrado p\u00fablico, donde solo se usa visi\u00f3n nocturna monocrom\u00e1tica.","Una c\u00e1mara PTZ que recorre presets en un pasillo bien iluminado."]},{"n":11,"s":2,"q":"\u00bfCu\u00e1l de estas descripciones cumple la regla \u201cdescribir primero, interpretar despu\u00e9s\u201d?","o":["Persona sospechosa merodeando frente al local durante toda la noche, con una actitud nerviosa y muy extra\u00f1a, mirando hacia adentro.","Parece que est\u00e1 por robar la caja, porque mira hacia adentro varias veces y se lo ve inquieto en la puerta.","Hombre de aspecto extra\u00f1o que seguramente viene a robar, ya que no entra al local ni tampoco se retira.","La persona permanece unos 8 minutos junto al acceso, mira repetidamente al interior y prueba el picaporte a las 22:14."]},{"n":12,"s":2,"q":"\u00bfCu\u00e1l es la secuencia operativa de cinco pasos que propone el manual?","o":["Observar, comunicar, verificar, evaluar y registrar.","Observar, verificar, evaluar, comunicar y registrar.","Verificar, observar, comunicar, evaluar y registrar.","Observar, evaluar, registrar, verificar y comunicar."]},{"n":13,"s":2,"q":"Un operador ve a una persona manipulando varias veces una puerta restringida. \u00bfQu\u00e9 respuesta corresponde?","o":["Observar con la c\u00e1mara principal, verificar con otra, comprobar horario y acceso, comunicar seg\u00fan protocolo y registrar solo lo comprobable.","Dejar el puesto para ir a interceptar a la persona antes de que logre ingresar a la zona restringida.","Avisar a la Polic\u00eda que un delincuente intenta entrar, para ganar tiempo y no esperar ninguna verificaci\u00f3n.","Esperar a tener certeza total sobre la intenci\u00f3n de la persona antes de avisar a nadie y reci\u00e9n registrar lo ocurrido al final del turno, con todo el detalle."]},{"n":14,"s":2,"q":"Un operador deja de mirar el acceso principal porque algo ocurre en una c\u00e1mara secundaria. \u00bfQu\u00e9 error frecuente ilustra?","o":["Avisar tarde por esperar certeza absoluta.","Emitir conclusiones sobre intenciones que no pueden comprobarse.","Abandonar la observaci\u00f3n principal por una situaci\u00f3n secundaria.","No registrar el incidente."]},{"n":15,"s":2,"q":"Ante una emergencia, \u00bfc\u00f3mo debe actuar el operador?","o":["Dejar el puesto para intervenir f\u00edsicamente apenas confirma el hecho con una segunda c\u00e1mara de apoyo y sin avisar a nadie antes.","Concentrarse primero en exportar la evidencia y avisar despu\u00e9s, cuando el video ya est\u00e9 a resguardo.","Esperar instrucciones del cliente sin comunicar nada hasta tener certeza total de lo que ocurri\u00f3.","Priorizar la seguridad de las personas, seguir el protocolo y comunicar informaci\u00f3n verificable desde su puesto."]},{"n":16,"s":2,"q":"Se necesita exportar un clip como evidencia de un hecho. \u00bfQu\u00e9 intervalo conviene exportar?","o":["Solo el segundo exacto en que ocurre el hecho, para que el archivo resulte lo m\u00e1s corto posible.","El m\u00ednimo necesario, incluyendo segundos o minutos antes y despu\u00e9s del hecho para dar contexto.","El d\u00eda completo de la c\u00e1mara, para no dejar afuera nada que pueda hacer falta m\u00e1s adelante.","Desde el inicio del turno hasta el momento en que el operador avis\u00f3 del hecho al responsable."]},{"n":17,"s":2,"q":"Un supervisor necesita un clip m\u00e1s corto y en otro formato para presentarlo. \u00bfQu\u00e9 indica el manual sobre el archivo original?","o":["Se recorta el original y se elimina el archivo completo para no duplicar la evidencia guardada.","Se prepara la copia necesaria, pero se conserva tambi\u00e9n la exportaci\u00f3n original sin editar.","Se recomprime el original y se guarda con el mismo nombre para evitar cualquier confusi\u00f3n.","Se sobrescribe el original con la versi\u00f3n convertida, que es la que se le entrega al supervisor."]},{"n":18,"s":2,"q":"\u00bfQu\u00e9 conjunto de datos corresponde al registro de un evento que debe completar el operador?","o":["Fecha y hora, c\u00e1mara o zona, descripci\u00f3n objetiva, acci\u00f3n tomada, personas notificadas, resultado y referencia al clip.","Fecha y hora, nombre de la persona observada, su probable intenci\u00f3n, c\u00e1mara y firma del operador que la detect\u00f3.","C\u00e1mara, descripci\u00f3n de la vestimenta, valoraci\u00f3n personal del riesgo, resultado y datos de contacto del operador que estaba de turno.","Fecha, resoluci\u00f3n de la c\u00e1mara, bitrate del canal, estado del disco y nombre del cliente que pidi\u00f3 el video."]},{"n":19,"s":2,"q":"Un operador necesita conservar la imagen de un hecho y el sistema tiene un m\u00e9todo formal de exportaci\u00f3n. \u00bfQu\u00e9 es correcto?","o":["Fotografiar la pantalla con su celular para no demorar, y borrar la foto al terminar el turno.","Enviar una captura por WhatsApp al supervisor, que es un canal r\u00e1pido y conocido por todos.","Grabar la pantalla con un programa instalado en su computadora personal, para tener respaldo.","Usar el m\u00e9todo formal y registrar qui\u00e9n export\u00f3, sin fotografiar la pantalla con un tel\u00e9fono."]},{"n":20,"s":2,"q":"Un operador renunci\u00f3 hace seis meses. \u00bfSigue obligado a guardar reserva sobre lo que vio en las im\u00e1genes?","o":["No: la obligaci\u00f3n de reserva termina el mismo d\u00eda en que finaliza la relaci\u00f3n laboral con el responsable de la base.","Solo durante el primer a\u00f1o; despu\u00e9s puede difundir lo que quiera sin otra obligaci\u00f3n.","S\u00ed: la Ley 18.331 dispone que la obligaci\u00f3n de secreto contin\u00faa despu\u00e9s de terminada la relaci\u00f3n.","Solo si firm\u00f3 un acuerdo de confidencialidad aparte con el responsable del sistema."]},{"n":21,"s":2,"q":"Un particular le pide a un operador una copia de una grabaci\u00f3n. \u00bfC\u00f3mo debe proceder?","o":["Canalizar la solicitud por el responsable designado, conforme al procedimiento y a la normativa.","Entregarla si el particular demuestra que aparece en las im\u00e1genes solicitadas.","Entregarla si considera que no se ven otras personas dentro del video.","Entregarla si el cliente lo autoriza por mensaje de texto, porque es quien contrat\u00f3 el servicio de monitoreo."]},{"n":22,"s":2,"q":"\u00bfCu\u00e1l de estas tareas corresponde al inicio del turno?","o":["Entregar las novedades al operador entrante.","Cerrar sesi\u00f3n o bloquear el puesto de trabajo.","Dejar registrados los incidentes que quedaron pendientes.","Comprobar la fecha y hora del sistema y que est\u00e9 grabando."]},{"n":23,"s":3,"q":"\u00bfQu\u00e9 norma reglamenta la Ley 18.331 y regula el procedimiento general para ejercer los derechos de las personas?","o":["El Decreto N.\u00ba 64/020, que desarrolla la responsabilidad proactiva y las vulneraciones.","La Resoluci\u00f3n URCDP N.\u00ba 989/010, que fija lineamientos sobre videovigilancia y se\u00f1al\u00e9tica.","El Decreto N.\u00ba 414/009, que regula el procedimiento de ejercicio de derechos.","Ninguna: la ley es de aplicaci\u00f3n directa y nunca fue objeto de reglamentaci\u00f3n."]},{"n":24,"s":3,"q":"Un responsable toma conocimiento de una vulneraci\u00f3n de seguridad que afecta datos personales. \u00bfQu\u00e9 plazo m\u00e1ximo se indica para comunicarla a la URCDP, en los casos alcanzados?","o":["24 horas h\u00e1biles desde que ocurri\u00f3 la vulneraci\u00f3n.","72 horas desde que se conoce la vulneraci\u00f3n.","5 d\u00edas h\u00e1biles desde que se conoce la vulneraci\u00f3n.","30 d\u00edas corridos desde que se conoce la vulneraci\u00f3n."]},{"n":25,"s":3,"q":"Una persona solicita acceso a im\u00e1genes en las que aparece. \u00bfQu\u00e9 plazo prev\u00e9 el Decreto 414/009 y qu\u00e9 cuidado debe tener el responsable?","o":["Responder en 72 horas, entregando el video completo sin ocultar a las dem\u00e1s personas registradas ni dejar constancia escrita de la entrega.","Responder en treinta d\u00edas corridos, entregando solo una captura de pantalla sin fecha ni hora.","Responder en el plazo que fije el instalador del sistema, sin cuidados especiales sobre terceros.","Responder en cinco d\u00edas h\u00e1biles, protegiendo a las dem\u00e1s personas registradas, por ejemplo con m\u00e1scaras de privacidad."]},{"n":26,"s":3,"q":"\u00bfCu\u00e1l de estas ubicaciones de c\u00e1mara es compatible con las gu\u00edas de la URCDP para edificios?","o":["Una c\u00e1mara en el acceso que capta solo la franja m\u00ednima de v\u00eda p\u00fablica vinculada a la entrada.","Una c\u00e1mara en el vestuario del gimnasio del edificio, para prevenir da\u00f1os en las instalaciones.","Una c\u00e1mara orientada al patio del predio lindero, para controlar los movimientos de los vecinos.","Una c\u00e1mara que cubre toda la vereda y la calzada que est\u00e1n frente al edificio."]},{"n":27,"s":3,"q":"Un cliente pregunta cu\u00e1ntos d\u00edas debe guardar sus grabaciones. \u00bfQu\u00e9 indican las gu\u00edas de la URCDP?","o":["La norma fija un plazo \u00fanico para todos los sistemas, que el responsable no puede modificar.","Deben conservarse siempre el mayor tiempo posible, por si m\u00e1s adelante hace falta como evidencia ante un reclamo.","No hay un plazo \u00fanico v\u00e1lido para todos: se conserva el m\u00ednimo tiempo imprescindible, seg\u00fan finalidad y riesgo.","El plazo lo define el instalador del sistema, seg\u00fan la capacidad del disco que haya instalado."]},{"n":28,"s":3,"q":"Una vez instalado un sistema de videovigilancia, \u00bfqu\u00e9 indican las orientaciones de la URCDP?","o":["La inscripci\u00f3n solo es necesaria si el sistema graba audio, y la se\u00f1al\u00e9tica resulta opcional.","La base de datos debe inscribirse cuando corresponda y debe colocarse se\u00f1al\u00e9tica visible que identifique al responsable.","La inscripci\u00f3n la realiza el instalador, y la se\u00f1al\u00e9tica no se exige en los espacios privados.","No hace falta inscribirla si el grabador no est\u00e1 conectado a Internet, y tampoco hace falta colocar se\u00f1al\u00e9tica alguna en el lugar."]},{"n":29,"s":3,"q":"Una c\u00e1mara incluye micr\u00f3fono. \u00bfQu\u00e9 criterio plantea el manual sobre el audio?","o":["Conviene activarlo siempre, porque aporta m\u00e1s informaci\u00f3n que la imagen por s\u00ed sola.","Se activa \u00fanicamente en horario nocturno, cuando hay menos personas circulando por la zona vigilada del predio.","Que la c\u00e1mara lo tenga no implica activarlo: si no es imprescindible, lo prudente es mantenerlo deshabilitado.","No requiere un an\u00e1lisis espec\u00edfico, porque se trata como una parte m\u00e1s de la imagen."]},{"n":30,"s":3,"q":"La Polic\u00eda solicita una grabaci\u00f3n dentro de su competencia. \u00bfQu\u00e9 indica el manual?","o":["El operador decide por su cuenta si la entrega o no, seg\u00fan su propio criterio sobre el caso y la urgencia que perciba en ese momento.","Solo puede entregarse si el cliente que est\u00e1 presente en el lugar lo autoriza en ese momento.","Debe negarse siempre, porque las im\u00e1genes son datos personales y est\u00e1n protegidas por la ley.","Debe entregarse lo requerido por la Polic\u00eda o la Justicia, siguiendo el procedimiento del responsable y dejando constancia."]},{"n":31,"s":4,"q":"Un equipo Hikvision usa un puerto HTTP distinto del 80 y la direcci\u00f3n 192.168.1.100 no abre. \u00bfC\u00f3mo se indica el puerto 81 en el navegador?","o":["http://192.168.1.100/81","http://192.168.1.100:81","http://81.192.168.1.100","http://192.168.1.81:100"]},{"n":32,"s":4,"q":"La pantalla de acceso del equipo abre, pero el video no aparece en el navegador. \u00bfQu\u00e9 conviene verificar primero?","o":["Compatibilidad del navegador, componente web, WebSocket y versi\u00f3n de firmware.","El estado de la c\u00e1mara, que probablemente tenga el sensor da\u00f1ado y deba reemplazarse.","El calendario de grabaci\u00f3n y el espacio libre que queda en el HDD del grabador.","La resoluci\u00f3n y el bitrate, reduci\u00e9ndolos en todos los canales del equipo."]},{"n":33,"s":4,"q":"Se necesita ver muchas c\u00e1maras a la vez desde una conexi\u00f3n remota limitada. \u00bfQu\u00e9 stream conviene usar?","o":["Main Stream, que prioriza la calidad de imagen y consume menos ancho de banda que el Sub Stream.","Main Stream, reduciendo la grilla a una sola ventana a la vez para ahorrar ancho de banda.","Da lo mismo, porque ambos flujos consumen el mismo ancho de banda en cualquier equipo.","Sub Stream, que usa una configuraci\u00f3n m\u00e1s liviana para visualizaci\u00f3n remota o m\u00faltiples ventanas."]},{"n":34,"s":4,"q":"Se debe localizar un hecho ocurrido a las 14:30. \u00bfDesde qu\u00e9 momento conviene empezar a reproducir?","o":["Exactamente a las 14:30:00, para no perder tiempo con material que no interesa.","Desde las 00:00 de ese d\u00eda, para no dejar afuera ning\u00fan momento de la grabaci\u00f3n.","Unos minutos antes, porque una acci\u00f3n puede comenzar antes de que sea evidente.","Un minuto despu\u00e9s, porque el hecho siempre se distingue mejor una vez desarrollado."]},{"n":35,"s":4,"q":"En Playback aparece un tramo grabado a partir de un evento configurado, como un movimiento. \u00bfA qu\u00e9 tipo de grabaci\u00f3n corresponde?","o":["Alarm/Event: grabaci\u00f3n asociada a un evento configurado.","Continuous: grabaci\u00f3n que se realiza durante los per\u00edodos programados.","Manual: grabaci\u00f3n iniciada por el operador o por una acci\u00f3n manual.","Snapshot: captura de una imagen fija que se guarda en la computadora local."]},{"n":36,"s":4,"q":"\u00bfD\u00f3nde pueden configurarse las rutas locales de guardado para capturas y clips, cuando el men\u00fa est\u00e1 disponible?","o":["En Configuration, dentro del apartado Network.","En Configuration, dentro del apartado Local.","En Live View, dentro de la barra del Snapshot.","En Playback, dentro del apartado Calendar."]},{"n":37,"s":4,"q":"\u00bfQu\u00e9 conjunto de datos corresponde a la ficha m\u00ednima de evidencia del manual?","o":["Incidente, c\u00e1mara, fecha, nombre de la persona observada y su domicilio.","C\u00e1mara, fecha, resoluci\u00f3n, bitrate, c\u00f3dec y contrase\u00f1a del equipo.","Operador, cliente, fecha, valor del equipo y firma del responsable.","Incidente, c\u00e1mara, fecha, intervalo, archivo, operador y observaciones."]},{"n":38,"s":4,"q":"Una c\u00e1mara PTZ debe volver r\u00e1pidamente a una posici\u00f3n previamente guardada. \u00bfQu\u00e9 funci\u00f3n se usa?","o":["Focus.","Snapshot.","Preset.","Manual Record."]},{"n":39,"s":4,"q":"\u00bfQu\u00e9 orden de pasos recomienda el manual para buscar una grabaci\u00f3n en Playback?","o":["Elegir la fecha, ejecutar la b\u00fasqueda, seleccionar la c\u00e1mara, elegir el stream y observar la l\u00ednea de tiempo.","Seleccionar la c\u00e1mara, elegir la fecha, elegir el stream, ejecutar la b\u00fasqueda y observar la l\u00ednea de tiempo.","Seleccionar la c\u00e1mara, ejecutar la b\u00fasqueda, elegir la fecha, elegir el stream y observar la l\u00ednea de tiempo.","Elegir el stream, ejecutar la b\u00fasqueda, seleccionar la c\u00e1mara, elegir la fecha y observar la l\u00ednea de tiempo."]},{"n":40,"s":4,"q":"Una c\u00e1mara se ve perfecta en Live View, pero Playback no muestra grabaciones de ayer. \u00bfQu\u00e9 afirmaci\u00f3n es correcta?","o":["Ver imagen en vivo y grabar no son equivalentes: hay que revisar calendario, HDD, canal y fecha/hora.","Si hay imagen en vivo, el sistema est\u00e1 grabando: el problema tiene que estar en el navegador.","Es normal: Playback solo muestra las grabaciones que inici\u00f3 manualmente el operador.","Indica que el disco est\u00e1 da\u00f1ado y que hay que formatearlo cuanto antes para poder recuperar la grabaci\u00f3n del d\u00eda."]},{"n":41,"s":5,"q":"Una empresa usa la cuenta de administrador para todos los operadores porque \u201ces m\u00e1s pr\u00e1ctico\u201d. \u00bfQu\u00e9 principio incumple?","o":["El de proporcionalidad: las c\u00e1maras deben captar \u00fanicamente lo necesario para su finalidad.","El de retenci\u00f3n m\u00ednima: las im\u00e1genes deben conservarse el menor tiempo posible.","El de m\u00ednimo privilegio: cada usuario debe tener solo los permisos necesarios para su funci\u00f3n.","El de redundancia: toda funci\u00f3n cr\u00edtica del sistema debe tener un respaldo."]},{"n":42,"s":5,"q":"Un operador dej\u00f3 la organizaci\u00f3n. \u00bfQu\u00e9 debe hacerse con su usuario en el equipo?","o":["Dejarlo activo con perfil de consulta, por si hace falta ver el historial m\u00e1s adelante.","Cambiarle el perfil a administrador para que otro operador pueda utilizarlo.","Compartir su contrase\u00f1a con quien lo reemplaza, para no crear un usuario nuevo.","Eliminarlo o deshabilitarlo, y revisar peri\u00f3dicamente los permisos que quedan."]},{"n":43,"s":5,"q":"Un cliente quiere ver su NVR desde fuera de la red local. \u00bfQu\u00e9 recomienda el manual?","o":["Usar mecanismos dise\u00f1ados para acceso remoto seguro, como Hik-Connect, con firmware y credenciales actualizados.","Publicar el equipo directamente en Internet abriendo puertos, porque es la opci\u00f3n m\u00e1s estable y no requiere cuenta alguna.","Dejar las credenciales de f\u00e1brica, para que el soporte remoto pueda ingresar sin demoras.","Desactivar las contrase\u00f1as del equipo mientras dure el acceso remoto desde la calle."]},{"n":44,"s":5,"q":"Un testigo asegura que el hecho ocurri\u00f3 a las 21:10 seg\u00fan su tel\u00e9fono. \u00bfQu\u00e9 conviene hacer antes de concluir que la grabaci\u00f3n corresponde a ese minuto?","o":["Cambiar la hora del equipo para que coincida con la que indica el tel\u00e9fono del testigo.","Anotar la fuente de esa hora y considerar posibles diferencias de reloj entre el tel\u00e9fono y el equipo.","Dar por v\u00e1lida la hora del testigo, porque el reloj del equipo nunca es confiable.","Descartar la grabaci\u00f3n, porque una hora externa no puede contrastarse con la del equipo."]},{"n":45,"s":5,"q":"\u00bfCu\u00e1l es la regla profesional para actualizar el firmware de un grabador?","o":["Instalar siempre la \u00faltima versi\u00f3n apenas aparece, aunque haya una investigaci\u00f3n en curso.","Actualizar con motivo, con versi\u00f3n compatible con el modelo y la regi\u00f3n, y con procedimiento documentado.","Actualizar durante un incidente, para corregir la falla cuanto antes.","Instalar cualquier versi\u00f3n disponible, porque el firmware es compatible entre todos los modelos y regiones del fabricante."]},{"n":46,"s":5,"q":"Un NVR dej\u00f3 de grabar. \u00bfQu\u00e9 dice el manual sobre reiniciarlo?","o":["Debe hacerse de inmediato, porque el reinicio resuelve la mayor\u00eda de las fallas de grabaci\u00f3n que se presentan.","No debe reiniciarse nunca, porque el equipo pierde todas las grabaciones que tiene guardadas.","Puede servir, pero no primero: antes se registran los s\u00edntomas y se revisa qu\u00e9 evidencia podr\u00eda perderse.","Solo corresponde despu\u00e9s de formatear el HDD, para partir de un disco limpio."]},{"n":47,"s":5,"q":"Un t\u00e9cnico detecta errores en el HDD de un grabador. \u00bfQu\u00e9 precauci\u00f3n indica el manual antes de reemplazarlo?","o":["Formatearlo para descartar errores l\u00f3gicos, y reci\u00e9n despu\u00e9s revisar qu\u00e9 informaci\u00f3n se perdi\u00f3 durante el procedimiento.","Reemplazarlo sin avisar, para no interrumpir el servicio que recibe el cliente.","Cambiar la fecha de instalaci\u00f3n en el registro para reiniciar el control del disco.","Confirmar qu\u00e9 informaci\u00f3n debe preservarse y no formatear sin autorizaci\u00f3n, porque se pueden destruir grabaciones."]},{"n":48,"s":5,"q":"Una c\u00e1mara figura offline en un NVR. \u00bfQu\u00e9 indica el manual como primeras comprobaciones?","o":["Alimentaci\u00f3n, cableado, enlace, IP, PoE y credenciales.","Calendario, HDD, espacio disponible, canal y fecha/hora.","Compatibilidad del navegador, componente web, stream y c\u00f3dec.","Zona horaria, NTP y sincronizaci\u00f3n con la computadora."]},{"n":49,"s":5,"q":"Al intentar exportar un clip, la descarga no se realiza. \u00bfQu\u00e9 indica el manual como primeras comprobaciones?","o":["Calendario de grabaci\u00f3n, HDD, espacio disponible, canal y fecha/hora.","Cable y red, IP de la PC, ping, puerto y firewall.","Ruta Local de guardado, permisos del navegador o de Windows y componente web.","Alimentaci\u00f3n, cableado, enlace, IP, PoE y credenciales."]},{"n":50,"s":5,"q":"\u00bfQu\u00e9 enfoque de diagn\u00f3stico recomienda el manual?","o":["Cambiar a la vez navegador, c\u00f3dec, red y grabaci\u00f3n para acelerar la soluci\u00f3n.","Empezar siempre por actualizar el firmware del equipo, porque eso corrige la mayor\u00eda de las fallas que se presentan.","Restaurar el equipo de f\u00e1brica para partir de una configuraci\u00f3n limpia.","Avanzar de lo simple y observable a lo espec\u00edfico, cambiando un par\u00e1metro por vez y documentando cada paso."]}]};

/* ---------- Docente: datos ---------- */
async function cargarPanel(){
  if (S.cargando || !S.owner) return;
  S.cargando = true;
  try {
    if (!S.claveLista){
      var k = await api('GET', '/rest/v1/clave?select=respuestas,minimo&id=eq.1');
      if (Array.isArray(k) && k[0]){
        var rr = String(k[0].respuestas || '');
        if (rr.length === N && /^[A-D]+$/.test(rr)) S.clave = rr;
        if (isFinite(k[0].minimo)) S.minimo = Number(k[0].minimo);
      }
      S.claveLista = true;
    }
    var d = await api('GET', '/rest/v1/entregas?select=id,nombre,respuestas,inicio,fin,duracion_seg,origen,creado&order=creado.desc&limit=1000');
    S.docs = Array.isArray(d) ? d : [];
    S.aviso = null; S.actualizado = new Date();
  } catch(e){
    if (e.status === 401){ S.cargando = false; sesionVencida(); return; }
    S.aviso = 'No se pudieron leer las entregas (' + (e.status ? 'error ' + e.status : 'sin conexión') + '). Probá con Actualizar.';
  }
  S.cargado = true; S.cargando = false;
  updDocente();
}
function actualizar(){ S.claveLista = false; setMsg('actmsg', 'Actualizando…', ''); cargarPanel(); }

function filas(){
  var rows = S.docs.map(function(d){
    var r = d.respuestas;
    if (typeof r !== 'string' || !RESP_RE.test(r)) return null;
    var sc = null;
    if (S.clave){ sc = 0; for (var i = 0; i < N; i++) if (r.charAt(i) === S.clave.charAt(i)) sc++; }
    var nombre = String(d.nombre || 'Sin nombre').slice(0, 80);
    return {id:d.id, nombre:nombre, k:normNombre(nombre), r:r, sc:sc, fin:d.fin || d.inicio || d.creado || '', dur:Number(d.duracion_seg) || 0, imp:d.origen === 'codigo'};
  }).filter(Boolean).sort(function(a, b){ return (Date.parse(b.fin) || 0) - (Date.parse(a.fin) || 0); });
  var cnt = {};
  rows.forEach(function(r){ cnt[r.k] = (cnt[r.k] || 0) + 1; });
  rows.forEach(function(r){ r.rep = cnt[r.k] > 1; });
  return rows;
}

function updDocente(){
  if (S.view !== 'docente' || !$('#dstats')) return;

  var err = $('#derr'); err.replaceChildren();
  if (S.claveLista && !S.clave) err.append(h('p', {class:'note warn'}, 'No se encontró la clave de respuestas, así que todavía no se pueden calcular los puntajes. Revisá que hayas ejecutado el SQL completo y que el email de la función es_docente() sea el mismo con el que entraste.'));
  if (S.aviso) err.append(h('p', {class:'note warn'}, S.aviso));
  if (rows.some(function(r){ return r.rep; })) err.append(h('p', {class:'note'}, 'Hay alumnos con más de una entrega con el mismo nombre. Abrí cada una y eliminá la que no corresponda.'));

  var conSc = rows.filter(function(r){ return r.sc != null; });
  var aprob = conSc.filter(function(r){ return r.sc >= S.minimo; }).length;
  var prom = conSc.length ? conSc.reduce(function(a, r){ return a + r.sc; }, 0) / conSc.length : null;

    stat('Mínimo', S.minimo + ' / ' + N)));
  var am = $('#actmsg');
  if (am && S.actualizado && !S.cargando) am.textContent = 'Actualizado a las ' + S.actualizado.toLocaleTimeString('es-UY', {hour:'2-digit', minute:'2-digit'}) + ' · se actualiza solo cada 20 segundos';

  var tb = $('#dtable'); tb.replaceChildren();
  if (!S.cargado){
    tb.append(h('div', {class:'tw'}, h('p', {class:'empty'}, 'Cargando entregas…')));
  } else if (!rows.length){
    tb.append(h('div', {class:'tw'}, h('p', {class:'empty'}, 'Todavía no hay entregas. Cuando un alumno entregue, aparece acá.')));
  } else {
    var tbody = h('tbody');
    rows.forEach(function(r){
      var ap = r.sc != null && r.sc >= S.minimo;
      tbody.append(h('tr', {class:S.abierta === r.id ? 'on' : null},
        h('td', null, h('button', {class:'lk', type:'button', onclick:function(){ S.abierta = (S.abierta === r.id ? null : r.id); S.delId = null; updDocente(); }}, r.nombre),
          r.imp ? h('span', {class:'msg'}, ' · cargada por código') : null,
          r.rep ? [' ', h('span', {class:'pill warn'}, 'Nombre repetido')] : null),
        h('td', {class:'num'}, r.sc == null ? '—' : r.sc + ' / ' + N),
        h('td', {class:'num'}, r.sc == null ? '—' : pct(r.sc, N) + '%'),
        h('td', null, r.sc == null ? '—' : h('span', {class:'pill ' + (ap ? 'ok' : 'bad')}, ap ? 'Aprobado' : 'No aprobado')),
        h('td', null, fmtFecha(r.fin)),
        h('td', {class:'num'}, fmtDur(r.dur))));
    });
    tb.append(h('div', {class:'tw'}, h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Alumno'), h('th', {class:'num'}, 'Puntaje'), h('th', {class:'num'}, '%'), h('th', null, 'Resultado'), h('th', null, 'Entregado'), h('th', {class:'num'}, 'Tiempo'))),
      tbody)));
  }

  var dd = $('#ddetail'); dd.replaceChildren();
  var sel = rows.filter(function(r){ return r.id === S.abierta; })[0];
  if (sel) dd.append(detalle(sel));

  var hd = $('#dhard'); hd.replaceChildren();
  if (!S.clave) hd.append(h('p', {class:'msg'}, 'Se calcula cuando está cargada la clave.'));
  else if (!rows.length) hd.append(h('p', {class:'msg'}, 'Se calcula con la primera entrega.'));
  else {
    var errs = QS.map(function(q, i){
      var mal = rows.filter(function(r){ return r.r.charAt(i) !== S.clave.charAt(i); }).length;
      return {q:q, mal:mal};
    }).filter(function(x){ return x.mal > 0; }).sort(function(a, b){ return b.mal - a.mal || a.q.n - b.q.n; }).slice(0, 8);
    if (!errs.length) hd.append(h('p', {class:'msg'}, 'Hasta ahora no hay respuestas incorrectas.'));
    else hd.append(h('div', {class:'hard'}, errs.map(function(x){
      var p = pct(x.mal, rows.length);
      var tx = x.q.q.length > 110 ? x.q.q.slice(0, 107) + '…' : x.q.q;
      return h('div', {class:'hrow'}, h('div', null, h('span', {class:'qn'}, x.q.n + '. '), tx),
        h('div', null, h('div', {class:'tr'}, h('i', {style:'width:' + p + '%'})), h('div', {class:'pc'}, p + '% erró (' + x.mal + ' de ' + rows.length + ')')));
    })));
  }
  var mi = $('#minimo'); if (mi && document.activeElement !== mi) mi.value = String(S.minimo);
}
function stat(k, v){ return h('div', {class:'stat'}, h('div', {class:'k'}, k), h('div', {class:'v'}, v)); }
function detalle(r){
  var ap = r.sc != null && r.sc >= S.minimo;
  var box = h('div', {class:'detail'});
  box.append(h('div', {class:'dh'},
    h('h2', null, r.nombre),
    h('p', {class:'msg'}, r.sc == null ? 'Sin clave cargada.' : r.sc + ' de ' + N + ' (' + pct(r.sc, N) + '%) · ' + (ap ? 'Aprobado' : 'No aprobado') + ' · ' + fmtFecha(r.fin)),
    h('div', {class:'row'},
      h('button', {class:'btn ghost sm', type:'button', onclick:function(){ S.soloErrores = !S.soloErrores; updDocente(); }}, S.soloErrores ? 'Mostrar todas las preguntas' : 'Mostrar solo las incorrectas'),
      h('button', {class:'btn ghost sm', type:'button', onclick:function(){ S.abierta = null; S.delId = null; updDocente(); }}, 'Cerrar'),
      S.delId === r.id
        ? [h('button', {class:'btn sm', type:'button', onclick:function(){ eliminar(r.id); }}, 'Confirmar: eliminar entrega'), h('button', {class:'btn ghost sm', type:'button', onclick:function(){ S.delId = null; updDocente(); }}, 'Cancelar')]
        : h('button', {class:'btn ghost sm', type:'button', onclick:function(){ S.delId = r.id; updDocente(); }}, 'Eliminar entrega')),
    S.delId === r.id ? h('p', {class:'msg'}, 'La entrega se borra de forma definitiva.') : null));
  QS.forEach(function(q, i){
    var dado = r.r.charAt(i), ok = S.clave && dado === S.clave.charAt(i);
    if (S.soloErrores && (ok || !S.clave)) return;
    var oi = 'ABCD'.indexOf(dado), ci = S.clave ? 'ABCD'.indexOf(S.clave.charAt(i)) : -1;
    box.append(h('div', {class:'it' + (S.clave && !ok ? ' bad' : '')},
      h('span', {class:'qn'}, q.n),
      h('div', null, h('p', {class:'t'}, q.q),
        h('p', {class:'ans'}, h('b', null, 'Respondió'), oi < 0 ? 'Sin respuesta' : dado + ') ' + q.o[oi]),
        S.clave && !ok ? h('p', {class:'ans'}, h('b', null, 'Correcta'), S.clave.charAt(i) + ') ' + q.o[ci]) : null)));
  });
  if (S.soloErrores && S.clave && r.sc === N) box.append(h('p', {class:'empty'}, 'No hay respuestas incorrectas.'));
  return box;
}
async function guardarMinimo(){
  var v = parseInt($('#minimo').value, 10);
  if (!isFinite(v) || v < 0 || v > N){ setMsg('minmsg', 'Ingresá un número entre 0 y ' + N + '.', 'err'); return; }
  try {
    var r = await api('PATCH', '/rest/v1/clave?id=eq.1', {minimo:v}, {Prefer:'return=representation'});
    if (!Array.isArray(r) || !r.length) throw new Error('sin filas');
    S.minimo = v; setMsg('minmsg', 'Guardado.', 'ok'); updDocente();
  } catch(e){ setMsg('minmsg', 'No se pudo guardar. Probá de nuevo.', 'err'); }
}
async function eliminar(id){
  try {
    var r = await api('DELETE', '/rest/v1/entregas?id=eq.' + encodeURIComponent(id), null, {Prefer:'return=representation'});
    if (!Array.isArray(r) || !r.length) throw new Error('sin filas');
    S.docs = S.docs.filter(function(d){ return d.id !== id; }); S.abierta = null; S.aviso = null;
  } catch(e){ S.aviso = 'No se pudo eliminar la entrega. Probá de nuevo.'; }
  S.delId = null;
  updDocente();
}
async function importar(){
  var raw = ($('#cod').value || '').trim();
  if (raw.slice(0, 4) !== 'HS1.'){ setMsg('impmsg', 'El código tiene que empezar con HS1.', 'err'); return; }
  var o;
  try { o = JSON.parse(b64d(raw.slice(4))); } catch(e){ setMsg('impmsg', 'No se pudo leer el código. Revisá que esté completo.', 'err'); return; }
  if (!o || typeof o.nombre !== 'string' || typeof o.respuestas !== 'string' || !RESP_RE.test(o.respuestas)){ setMsg('impmsg', 'El código no tiene el formato esperado.', 'err'); return; }
  try {
    await api('POST', '/rest/v1/entregas', {
      nombre:o.nombre.trim().slice(0, 80), respuestas:o.respuestas,
      inicio:isoOk(o.inicio) ? o.inicio : null, fin:isoOk(o.fin) ? o.fin : new Date().toISOString(),
      duracion_seg:clampDur(o.duracionSeg), origen:'codigo'}, {Prefer:'return=minimal'});
    $('#cod').value = ''; setMsg('impmsg', 'Entrega de ' + o.nombre.trim().slice(0, 80) + ' cargada.', 'ok');
    cargarPanel();
  } catch(e){ if (e.status === 401) sesionVencida(); else setMsg('impmsg', 'No se pudo cargar la entrega. Probá de nuevo.', 'err'); }
}
function exportarCsv(){
  var rows = filas();
  if (!rows.length){ setMsg('csvmsg', 'Todavía no hay entregas para descargar.', ''); return; }
  function esc(v){ var s = String(v); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; }
  var lines = [['Alumno','Puntaje','Total','Porcentaje','Resultado','Entregado','Minutos'].map(esc).join(',')];
  rows.forEach(function(r){
    lines.push([r.nombre, r.sc == null ? '' : r.sc, N, r.sc == null ? '' : pct(r.sc, N), r.sc == null ? '' : (r.sc >= S.minimo ? 'Aprobado' : 'No aprobado'), fmtFecha(r.fin), r.dur ? Math.round(r.dur / 60) : ''].map(esc).join(','));
  });
  var blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = h('a', {href:url, download:'resultados-examen-cctv.csv'});
  document.body.append(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  setMsg('csvmsg', 'Descarga iniciada.', 'ok');
}

/* ---------- Arranque ---------- */
async function boot(){
  render();
  window.addEventListener('hashchange', function(){
    if (location.hash === '#docente' && !S.owner && S.view !== 'examen') go('login');
  });
  var ses = lsGet(LS_SES);
  if (CONFIGURED && ses && ses.refresh){
    S.refresh = ses.refresh;
    if (await refrescar()){
      S.owner = true; S.view = 'docente'; render(); iniciarPolling(); cargarPanel();
    } else { S.refresh = null; S.token = null; lsSet(LS_SES, null); }
  }
}
boot();
})();

</script>
